<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Revenue Calculator — Prime AD Solutions</title>
  <meta name="description" content="Interactive Medicare reimbursement estimator for PGx, UTI, Immunodeficiency, and CGx lab campaigns. Powered by CY2026 CLFS rates.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=2">
  <!-- Chart.js CDN for Analytics view -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-size:14px; font-weight:500; color:var(--text-secondary);">Loading CY2026 Fee Schedule data...</div>
  </div>

  <div id="app">
    <!-- Sidebar Navigation -->
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">💰</div>
        <div class="brand-text">
          <div class="brand-title">Lab Revenue</div>
          <div class="brand-sub">Prime AD Solutions</div>
        </div>
      </div>

      <div class="nav-section-label">Navigation</div>

      <button class="nav-item active" data-view="calculator">
        <span class="nav-icon">💰</span>
        <span>Revenue Calculator</span>
      </button>

      <button class="nav-item" data-view="browse">
        <span class="nav-icon">🔍</span>
        <span>Browse Fee Schedule</span>
      </button>

      <button class="nav-item" data-view="analytics">
        <span class="nav-icon">📊</span>
        <span>Analytics</span>
      </button>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" title="Toggle Light/Dark Theme">
          <span>☀️</span>
          <span>Light Mode</span>
        </button>
        <div class="vintage-badge">CMS CY2026 CLFS Rates</div>
      </div>
    </aside>

    <!-- Main View Container -->
    <main id="main">
      <div id="view-container" style="display:flex; flex-direction:column; height:100%;"></div>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
